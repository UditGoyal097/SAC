<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="max-width">
            <!-- Header -->
            <div class="header">
                <div>
                    <h1>Weather App</h1>
                    <p class="subtitle">Check the weather anywhere</p>
                </div>
                <button class="toggle-btn" id="temperatureToggle">
                    <span class="toggle-label">°C</span>
                </button>
            </div>

            <!-- Search Bar -->
            <div class="search-container">
                <input 
                    type="text" 
                    id="searchInput" 
                    class="search-input" 
                    placeholder="Search for a city..."
                    autocomplete="off"
                >
                <button class="search-btn" id="searchBtn">Search</button>
            </div>

            <!-- Error Message -->
            <div id="errorMessage" class="error-message hidden">
                <div class="error-header">Weather Not Found</div>
                <div class="error-body" id="errorBody"></div>
            </div>

            <!-- Loading Spinner -->
            <div id="loadingSpinner" class="loading-spinner hidden">
                <div class="spinner"></div>
                <p>Loading weather data...</p>
            </div>

            <!-- Current Weather -->
            <div id="currentWeather" class="current-weather hidden">
                <div class="location-header">
                    <h2 id="locationName"></h2>
                    <p id="locationRegion"></p>
                </div>

                <div class="weather-main">
                    <div class="temperature-display">
                        <span id="temperatureValue" class="temperature"></span>
                        <span class="temperature-unit" id="temperatureUnit">°C</span>
                    </div>
                    <div class="condition-display">
                        <span id="weatherIcon" class="weather-icon">🌤️</span>
                        <span id="weatherCondition" class="weather-condition">Clear</span>
                    </div>
                </div>

                <div class="weather-details">
                    <div class="detail-item">
                        <div class="detail-label">Feels Like</div>
                        <div class="detail-value"><span id="feelsLike">--</span>°</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Humidity</div>
                        <div class="detail-value"><span id="humidity">--%</span></div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Wind Speed</div>
                        <div class="detail-value"><span id="windSpeed">--</span> <span id="windUnit">km/h</span></div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Pressure</div>
                        <div class="detail-value"><span id="pressure">--</span> mb</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Visibility</div>
                        <div class="detail-value"><span id="visibility">--</span> <span id="visibilityUnit">km</span></div>
                    </div>
                </div>
            </div>

            <!-- Forecast -->
            <div id="forecast" class="forecast hidden">
                <h3>5-Day Forecast</h3>
                <div class="forecast-grid" id="forecastGrid"></div>
            </div>

            <!-- Empty State -->
            <div id="emptyState" class="empty-state">
                <p>Loading weather data...</p>
            </div>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
